<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV ATS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
margin:0;
padding:20px;
background:#ddd;
font-family:Arial;
}

/* A4 FIX 1 HALAMAN */
#cv{
width:210mm;
height:297mm;
background:#fff;
margin:auto;
padding:18px;
box-sizing:border-box;
overflow:hidden;
}

/* tombol */
button{
position:fixed;
top:20px;
right:20px;
padding:10px 15px;
background:#2563eb;
color:#fff;
border:none;
cursor:pointer;
border-radius:6px;
}

/* HEADER */
.header{
display:flex;
gap:18px;
align-items:flex-start;
margin-bottom:10px;
}

/* FOTO 4x6 */
.header img{
width:100px;
height:150px;
object-fit:cover;
border:1.5px solid #000;
border-radius:4px;
}

/* NAMA */
h1{
margin:0;
font-size:30px;
line-height:1.1;
}

h3{
margin:3px 0 6px 0;
font-size:15px;
color:#444;
font-weight:normal;
}

/* KONTAK */
.contact{
font-size:13px;
line-height:1.5;
}

.contact p{
margin:2px 0;
display:flex;
align-items:center;
gap:6px;
}

/* SECTION */
.section{
margin-top:10px;
}

.section h2{
font-size:15px;
border-bottom:2px solid #000;
padding-bottom:3px;
margin-bottom:6px;
}

/* ITEM */
.item{
margin-bottom:6px;
}

small{
color:#555;
font-size:12px;
}

/* ABOUT */
.about{
text-align:justify;
font-size:13px;
line-height:1.4;
}

/* LIST */
ul{
padding-left:18px;
margin:0;
font-size:13px;
}
</style>
</head>

<body>

<button onclick="downloadPDF()">Download PDF</button>

<div id="cv">

<!-- HEADER -->
<div class="header">
  <img id="photo">

  <div>
    <h1 id="name"></h1>
    <h3 id="title"></h3>

    <div class="contact">
      <p id="phone"></p>
      <p id="email"></p>
      <p id="location"></p>
      <p id="github"></p>
      <p id="portfolio"></p>
    </div>
  </div>
</div>

<!-- ABOUT -->
<div class="section">
<h2>Profil</h2>
<p id="about" class="about"></p>
</div>

<!-- SKILLS -->
<div class="section">
<h2>Keahlian</h2>
<ul id="skills"></ul>
</div>

<!-- EXPERIENCE -->
<div class="section">
<h2>Pengalaman</h2>
<div id="experience"></div>
</div>

<!-- EDUCATION -->
<div class="section">
<h2>Pendidikan</h2>
<div id="education"></div>
</div>

<!-- CERT -->
<div class="section">
<h2>Sertifikat</h2>
<div id="certificates"></div>
</div>

<!-- PROJECT -->
<div class="section">
<h2>Proyek</h2>
<div id="projects"></div>
</div>

</div>

<script>

const source = window.opener.document;

const qs = (el) => source.querySelector(el);
const qsa = (el) => source.querySelectorAll(el);

/* HEADER */
document.getElementById("photo").src = qs("#home img")?.src || "";
document.getElementById("name").innerText = qs("#home h1")?.innerText || "";
document.getElementById("title").innerText = qs("#home p")?.innerText || "";

/* ABOUT */
document.getElementById("about").innerText = qs("#about p")?.innerText || "";

/* CONTACT */
const box = qs("#cv-data");

document.getElementById("phone").innerHTML =
"📱 " + (box?.dataset.phone || "-");

document.getElementById("email").innerHTML =
"📧 " + (box?.dataset.email || "-");

document.getElementById("location").innerHTML =
"📍 " + (box?.dataset.location || "-");

document.getElementById("github").innerHTML =
"💻 " + (box?.dataset.github || "-");

document.getElementById("portfolio").innerHTML =
"🌐 " + (box?.dataset.portfolio || "-");

/* SKILLS */
document.getElementById("skills").innerHTML =
Array.from(qsa("#skills i"))
.map(i => `<li>${i.getAttribute("title")}</li>`)
.join(" ");

/* EXPERIENCE */
document.getElementById("experience").innerHTML =
Array.from(qsa("#experience > div > div"))
.map(exp => {
const title = exp.querySelector("h3")?.innerText || "";
const date = exp.querySelector("em")?.innerText || "";
const desc = Array.from(exp.querySelectorAll("li"))
.map(li => "• " + li.innerText)
.join("<br>");

return `
<div class="item">
<b>${title}</b><br>
<small>${date}</small><br>
${desc}
</div>
`;
}).join("");

/* EDUCATION (HANYA D3 SISTEM INFORMASI) */
document.getElementById("education").innerHTML =
Array.from(qsa("#education > div > div"))
.filter(e => (e.querySelector("h3")?.innerText || "").includes("D3 Sistem Informasi"))
.map(e => `
<div class="item">
<b>${e.querySelector("h3")?.innerText || ""}</b><br>
<small>${e.querySelector("em")?.innerText || ""}</small>
</div>
`).join("");

/* CERT */
document.getElementById("certificates").innerHTML =
Array.from(qsa("#certificates .card h3"))
.map(c => `<div class="item">• ${c.innerText}</div>`)
.join("");

/* PROJECT */
document.getElementById("projects").innerHTML =
Array.from(qsa("#projects .card h3"))
.map(p => `<div class="item">• ${p.innerText}</div>`)
.join("");

/* PDF */
function downloadPDF(){
html2pdf().set({
margin:5,
filename:"CV_AtalarikSatriaDinata.pdf",
image:{type:"jpeg",quality:1},
html2canvas:{scale:2},
jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
}).from(document.getElementById("cv")).save();
}

</script>

</body>
</html>
