<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CV ATS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
margin:0;
padding:20px;
background:#ddd;
font-family:Arial,sans-serif;
}

button{

position:fixed;

top:20px;

right:20px;

padding:10px 16px;

border:none;

border-radius:6px;

background:#2563eb;

color:#fff;

cursor:pointer;

z-index:999;
}

#cv{

width:794px;

min-height:1123px;

background:#fff;

margin:auto;

padding:28px;

box-sizing:border-box;
}

.header{

display:flex;

gap:18px;

margin-bottom:12px;
}

.header img{

width:100px;

height:150px;

object-fit:cover;

border:1px solid #000;
}

.header-right{

flex:1;
}

h1{

margin:0;

font-size:28px;
}

h3{

margin:3px 0 8px 0;

font-size:15px;

font-weight:normal;

color:#555;
}

.contact{

font-size:13px;

line-height:1.5;
}

.contact p{

margin:2px 0;
}

.section{

margin-top:10px;
}

.section h2{

font-size:15px;

margin:0 0 6px;

padding-bottom:3px;

border-bottom:2px solid #000;
}

.about{

font-size:13px;

line-height:1.4;

text-align:justify;
}

ul{

margin:0;

padding-left:18px;

font-size:13px;
}

.item{

font-size:13px;

margin-bottom:8px;
}

small{

font-size:12px;

color:#666;
}

</style>

</head>

<body>

<button onclick="downloadPDF()">

Download PDF

</button>

<div id="cv">

<div class="header">

<img id="photo">

<div class="header-right">

<h1 id="name"></h1>

<h3 id="title"></h3>

<div class="contact">

<p id="phone"></p>

<p id="email"></p>

<p id="location"></p>

<p id="github"></p>

<p id="portfolio"></p>

</div>

</div>

</div>

<div class="section">

<h2>Profil</h2>

<p id="about" class="about"></p>

</div>

<div class="section">

<h2>Keahlian</h2>

<ul id="skills"></ul>

</div>

<div class="section">

<h2>Pengalaman</h2>

<div id="experience"></div>

</div>

<div class="section">

<h2>Pendidikan</h2>

<div id="education"></div>

</div>

<div class="section">

<h2>Sertifikat</h2>

<div id="certificates"></div>

</div>

<div class="section">

<h2>Proyek</h2>

<div id="projects"></div>

</div>

</div>

<script>

const source = window.opener.document;

const qs=(el)=>source.querySelector(el);

const qsa=(el)=>source.querySelectorAll(el);


/* HEADER */

photo.src=qs("#home img")?.src || "";

name.innerText=qs("#home h1")?.innerText || "";

title.innerText=qs("#home p")?.innerText || "";


/* PROFIL */

about.innerText=qs("#about p")?.innerText || "";


/* KONTAK */

const box=qs("#cv-data");

phone.innerText="📱 "+(box?.dataset.phone || "-");

email.innerText="📧 "+(box?.dataset.email || "-");

location.innerText="📍 "+(box?.dataset.location || "-");

github.innerText="💻 "+(box?.dataset.github || "-");

portfolio.innerText="🌐 "+(box?.dataset.portfolio || "-");


/* SKILL */

skills.innerHTML=

Array.from(qsa("#skills i"))

.map(i=>`<li>${i.title}</li>`)

.join("");



/* EXPERIENCE */

experience.innerHTML=

Array.from(qsa("#experience > div > div"))

.map(exp=>{

const title=

exp.querySelector("h3")?.innerText || "";

const date=

exp.querySelector("em")?.innerText || "";


const desc=

Array.from(exp.querySelectorAll("li"))

.slice(0,2)

.map(li=>"• "+li.innerText)

.join("<br>");


return`

<div class="item">

<b>${title}</b><br>

<small>${date}</small><br>

${desc}

</div>

`;

})

.join("");



/* EDUCATION */

education.innerHTML=

Array.from(qsa("#education > div > div"))

.filter(e=>

(e.querySelector("h3")?.innerText || "")

.includes("D3 Sistem Informasi")

)

.map(e=>`

<div class="item">

<b>${e.querySelector("h3")?.innerText}</b><br>

<small>${e.querySelector("em")?.innerText}</small>

</div>

`)

.join("");



/* CERT */

certificates.innerHTML=

Array.from(qsa("#certificates .card h3"))

.map(c=>

`<div class="item">• ${c.innerText}</div>`

)

.join("");



/* PROJECT */

projects.innerHTML=

Array.from(qsa("#projects .card h3"))

.map(p=>

`<div class="item">• ${p.innerText}</div>`

)

.join("");



/* PDF */

function downloadPDF(){

const element=

document.getElementById("cv");

html2pdf()

.set({

margin:0,

filename:"CV_Atalarik.pdf",

image:{

type:"jpeg",

quality:1

},

html2canvas:{

scale:2,

useCORS:true

},

jsPDF:{

unit:"pt",

format:"a4",

orientation:"portrait"

}

})

.from(element)

.save();

}

</script>

</body>

</html>
