<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV ATS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
margin:0;
padding:20px;
background:#ddd;
font-family:Arial,sans-serif;
}

#cv{
width:210mm;
min-height:297mm;
background:white;
margin:auto;
padding:25px;
box-sizing:border-box;
}

button{
position:fixed;
top:20px;
right:20px;
padding:10px 15px;
border:none;
background:#2563eb;
color:white;
cursor:pointer;
border-radius:6px;
}

.header{
display:flex;
gap:20px;
align-items:center;
margin-bottom:20px;
}

.header img{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
border:2px solid #000;
}

h1{
margin:0;
font-size:26px;
}

h3{
margin:5px 0;
font-weight:normal;
color:#444;
}

.section{
margin-top:15px;
}

.section h2{
font-size:16px;
border-bottom:2px solid #000;
padding-bottom:3px;
margin-bottom:8px;
}

ul{
margin:0;
padding-left:18px;
}

.contact p{
margin:2px 0;
font-size:13px;
}

.about{
font-size:14px;
text-align:justify;
}

.item{
margin-bottom:8px;
}

small{
color:#555;
}

</style>

</head>

<body>

<button onclick="downloadPDF()">Download PDF</button>

<div id="cv">

<!-- HEADER -->
<div class="header">
<img id="photo">
<div>
<h1 id="name"></h1>
<h3 id="title"></h3>

<div class="contact">
<p id="phone"></p>
<p id="email"></p>
<p id="location"></p>
<p id="github"></p>
<p id="portfolio"></p>
</div>

</div>
</div>

<!-- ABOUT -->
<div class="section">
<h2>Profil</h2>
<p id="about" class="about"></p>
</div>

<!-- SKILLS -->
<div class="section">
<h2>Keahlian</h2>
<ul id="skills"></ul>
</div>

<!-- EXPERIENCE -->
<div class="section">
<h2>Pengalaman</h2>
<div id="experience"></div>
</div>

<!-- EDUCATION -->
<div class="section">
<h2>Pendidikan</h2>
<div id="education"></div>
</div>

<!-- CERT -->
<div class="section">
<h2>Sertifikat</h2>
<div id="certificates"></div>
</div>

<!-- PROJECT -->
<div class="section">
<h2>Proyek</h2>
<div id="projects"></div>
</div>

</div>

<script>

const data = JSON.parse(sessionStorage.getItem("portfolioData"));

console.log("DATA MASUK CV:", data);

// ❗ HARD STOP kalau null
if(!data){
alert("Data CV kosong / sessionStorage tidak terbaca");
throw new Error("No CV data");
}

// HEADER
document.getElementById("photo").src = data.photo || "";
document.getElementById("name").innerText = data.name || "-";
document.getElementById("title").innerText = data.title || "-";

// CONTACT
document.getElementById("phone").innerText = "📱 " + (data.phone || "-");
document.getElementById("email").innerText = "📧 " + (data.email || "-");
document.getElementById("location").innerText = "📍 " + (data.location || "-");
document.getElementById("github").innerText = "💻 " + (data.github || "-");
document.getElementById("portfolio").innerText = "🌐 " + (data.portfolio || "-");

// ABOUT
document.getElementById("about").innerText = data.about || "-";

// SKILLS
(document.getElementById("skills")).innerHTML =
(data.skills || []).map(s => `<li>${s}</li>`).join("");

// EXPERIENCE
document.getElementById("experience").innerHTML =
(data.experiences || []).map(exp => `
<div class="item">
<b>${exp.title || "-"}</b><br>
<small>${exp.date || "-"}</small><br>
${(exp.desc || []).map(d => "• " + d).join("<br>")}
</div>
`).join("");

// EDUCATION
document.getElementById("education").innerHTML =
(data.education || []).map(ed => `
<div class="item">
<b>${ed.title}</b><br>
<small>${ed.date}</small>
</div>
`).join("");

// CERT
document.getElementById("certificates").innerHTML =
(data.certificates || []).map(c => `<div class="item">• ${c}</div>`).join("");

// PROJECT
document.getElementById("projects").innerHTML =
(data.projects || []).map(p => `<div class="item">• ${p}</div>`).join("");

// PDF
function downloadPDF(){
html2pdf().set({
margin:5,
filename:"CV.pdf",
image:{type:"jpeg",quality:1},
html2canvas:{scale:2},
jsPDF:{unit:"mm",format:"a4"}
}).from(document.getElementById("cv")).save();
}

</script>

</body>
</html>
