<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV ATS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
margin:0;
padding:0;
background:#ddd;
font-family:Arial;
}

/* A4 FIX + CENTER */
#cv{
width:210mm;
min-height:297mm;
background:#fff;
margin:10px auto;
padding:18mm 18mm 15mm 18mm;
box-sizing:border-box;
}

/* BUTTON */
button{
position:fixed;
top:15px;
right:15px;
padding:8px 12px;
background:#2563eb;
color:#fff;
border:none;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

/* HEADER LEBIH RAPI */
.header{
display:flex;
gap:12px;              /* sebelumnya 20px */
align-items:flex-start;
margin-bottom:12px;    /* lebih rapat */
}

/* FOTO LEBIH KECIL SEDIKIT BIAR PADAT */
.header img{
width:95px;
height:95px;
border-radius:50%;
object-fit:cover;
border:2px solid #000;
}

/* TEKS HEADER LEBIH RAPI */
.header h1{
margin:0;
font-size:22px;
line-height:1.2;
}

.header h3{
margin:2px 0 6px 0;
font-size:14px;
font-weight:normal;
color:#444;
line-height:1.2;
}

/* CONTACT RAPAT */
.header p{
margin:2px 0;     /* ini kunci biar gak renggang */
font-size:12px;
line-height:1.2;
}

/* SECTION JARAK DIKURANGI */
.section{
margin-top:10px;
}

.section h2{
font-size:14px;
border-bottom:2px solid #000;
padding-bottom:2px;
margin-bottom:6px;
}

/* ITEM LEBIH COMPACT */
.item{
margin-bottom:6px;
font-size:13px;
}

small{
color:#555;
font-size:12px;
}

.about{
text-align:justify;
font-size:13px;
line-height:1.4;
}

ul{
padding-left:16px;
margin:0;
}

</style>
</head>

<body>

<button onclick="downloadPDF()">Download PDF</button>

<div id="cv">

<!-- HEADER -->
<div class="header">
<img id="photo">
<div>
<h1 id="name"></h1>
<h3 id="title"></h3>

<p id="phone"></p>
<p id="email"></p>
<p id="location"></p>
<p id="github"></p>
<p id="portfolio"></p>

</div>
</div>

<!-- ABOUT -->
<div class="section">
<h2>Profil</h2>
<p id="about" class="about"></p>
</div>

<!-- SKILLS -->
<div class="section">
<h2>Keahlian</h2>
<ul id="skills"></ul>
</div>

<!-- EXPERIENCE -->
<div class="section">
<h2>Pengalaman</h2>
<div id="experience"></div>
</div>

<!-- EDUCATION -->
<div class="section">
<h2>Pendidikan</h2>
<div id="education"></div>
</div>

<!-- CERT -->
<div class="section">
<h2>Sertifikat</h2>
<div id="certificates"></div>
</div>

<!-- PROJECT -->
<div class="section">
<h2>Proyek</h2>
<div id="projects"></div>
</div>

</div>

<script>
const source = window.opener.document;

// helper
const qs = (el) => source.querySelector(el);
const qsa = (el) => source.querySelectorAll(el);

// DATA BASIC
document.getElementById("photo").src = qs("#home img")?.src || "";
document.getElementById("name").innerText = qs("#home h1")?.innerText || "";
document.getElementById("title").innerText = qs("#home p")?.innerText || "";

document.getElementById("about").innerText = qs("#about p")?.innerText || "";

// CONTACT
const box = qs("#cv-data");
document.getElementById("phone").innerText = box?.dataset.phone || "";
document.getElementById("email").innerText = box?.dataset.email || "";
document.getElementById("location").innerText = box?.dataset.location || "";
document.getElementById("github").innerText = box?.dataset.github || "";
document.getElementById("portfolio").innerText = box?.dataset.portfolio || "";

// SKILLS
document.getElementById("skills").innerHTML =
Array.from(qsa("#skills i"))
.map(i => `<li>${i.getAttribute("title")}</li>`)
.join("");

// ✅ FIX EXPERIENCE (INI YANG BIKIN 1 MAGANG DOANG SEBELUMNYA)
document.getElementById("experience").innerHTML =
Array.from(qsa("#experience > div > div"))
.map(exp => {
const title = exp.querySelector("h3")?.innerText || "";
const date = exp.querySelector("em")?.innerText || "";
const desc = Array.from(exp.querySelectorAll("li"))
.map(li => "• " + li.innerText)
.join("<br>");

return `
<div class="item">
<b>${title}</b><br>
<small>${date}</small><br>
${desc}
</div>
`;
}).join("");

// EDUCATION
document.getElementById("education").innerHTML =
Array.from(qsa("#education > div > div"))
.map(e => `
<div class="item">
<b>${e.querySelector("h3")?.innerText || ""}</b><br>
<small>${e.querySelector("em")?.innerText || ""}</small>
</div>
`).join("");

// CERT
document.getElementById("certificates").innerHTML =
Array.from(qsa("#certificates .card h3"))
.map(c => `<div class="item">• ${c.innerText}</div>`)
.join("");

// PROJECT
document.getElementById("projects").innerHTML =
Array.from(qsa("#projects .card h3"))
.map(p => `<div class="item">• ${p.innerText}</div>`)
.join("");

// PDF
function downloadPDF(){
html2pdf().set({
margin:5,
filename:"CV.pdf",
image:{type:"jpeg",quality:1},
html2canvas:{scale:2},
jsPDF:{unit:"mm",format:"a4"}
}).from(document.getElementById("cv")).save();
}
</script>

</body>
</html>
