<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV ATS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
margin:0;
padding:0;
background:#ddd;
font-family:Arial;
}

/* FIX A4 STABLE */
#cv{
  width:210mm;
  min-height:297mm;
  background:#fff;
  margin:0 auto;
  padding:14mm;
  box-sizing:border-box;
  overflow:hidden;
}

html, body{
  /* margin:0;
  padding:0; */
  height:auto;
}

/* cegah html2pdf bikin page tambahan */
.section, .header{
  page-break-inside: avoid;
}

/* BUTTON */
button{
position:fixed;
top:15px;
right:15px;
padding:10px 14px;
background:#2563eb;
color:#fff;
border:none;
cursor:pointer;
border-radius:6px;
}

/* HEADER (FIX SHIFT ISSUE) */
.header{
display:flex;
gap:15px;
align-items:flex-start;
margin-bottom:8px;
}

/* FOTO 4x6 */
.header img{
width:100px;
height:150px;
object-fit:cover;
border:1.5px solid #000;
border-radius:4px;
}

/* NAME */
h1{
margin:0;
font-size:28px;
line-height:1.1;
}

h3{
margin:2px 0 6px 0;
font-size:14px;
color:#444;
font-weight:normal;
}

/* CONTACT RAPAT */
.contact{
font-size:12.5px;
line-height:1.4;
}

.contact p{
margin:2px 0;
}

/* SECTION */
.section{
margin-top:8px;
}

.section h2{
font-size:14px;
margin:0 0 5px 0;
border-bottom:1.5px solid #000;
padding-bottom:2px;
}

/* ITEM */
.item{
margin-bottom:6px;
font-size:13px;
}

small{
font-size:11.5px;
color:#555;
}

/* ABOUT */
.about{
font-size:13px;
text-align:justify;
line-height:1.4;
margin:0;
}

/* LIST */
ul{
margin:0;
padding-left:16px;
font-size:13px;
}
</style>
</head>

<body>

<button onclick="downloadPDF()">Download PDF</button>

<div id="cv">

<!-- HEADER -->
<div class="header">
  <img id="photo">

  <div>
    <h1 id="name"></h1>
    <h3 id="title"></h3>

    <div class="contact">
      <p id="phone"></p>
      <p id="email"></p>
      <p id="location"></p>
      <p id="github"></p>
      <p id="portfolio"></p>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div class="section">
<h2>Profil</h2>
<p id="about" class="about"></p>
</div>

<!-- SKILL -->
<div class="section">
<h2>Keahlian</h2>
<ul id="skills"></ul>
</div>

<!-- EXPERIENCE -->
<div class="section">
<h2>Pengalaman</h2>
<div id="experience"></div>
</div>

<!-- EDUCATION -->
<div class="section">
<h2>Pendidikan</h2>
<div id="education"></div>
</div>

<!-- CERT -->
<div class="section">
<h2>Sertifikat</h2>
<div id="certificates"></div>
</div>

<!-- PROJECT -->
<div class="section">
<h2>Proyek</h2>
<div id="projects"></div>
</div>

</div>

<script>

const source = window.opener.document;

const qs = (el) => source.querySelector(el);
const qsa = (el) => source.querySelectorAll(el);

/* HEADER */
document.getElementById("photo").src = qs("#home img")?.src || "";
document.getElementById("name").innerText = qs("#home h1")?.innerText || "";
document.getElementById("title").innerText = qs("#home p")?.innerText || "";

/* PROFILE */
document.getElementById("about").innerText = qs("#about p")?.innerText || "";

/* CONTACT */
const box = qs("#cv-data");

document.getElementById("phone").innerText = "📱 " + (box?.dataset.phone || "-");
document.getElementById("email").innerText = "📧 " + (box?.dataset.email || "-");
document.getElementById("location").innerText = "📍 " + (box?.dataset.location || "-");
document.getElementById("github").innerText = "💻 " + (box?.dataset.github || "-");
document.getElementById("portfolio").innerText = "🌐 " + (box?.dataset.portfolio || "-");

/* SKILLS */
document.getElementById("skills").innerHTML =
Array.from(qsa("#skills i"))
.map(i => `<li>${i.getAttribute("title")}</li>`)
.join(" ");

/* EXPERIENCE (ONLY 2 POINT) */
document.getElementById("experience").innerHTML =
Array.from(qsa("#experience > div > div"))
.map(exp => {
const title = exp.querySelector("h3")?.innerText || "";
const date = exp.querySelector("em")?.innerText || "";

/* ambil 2 poin penting */
const desc = Array.from(exp.querySelectorAll("li"))
.slice(0, 2)
.map(li => "• " + li.innerText)
.join("<br>");

return `
<div class="item">
<b>${title}</b><br>
<small>${date}</small><br>
${desc}
</div>
`;
}).join("");

/* EDUCATION (ONLY D3 SISTEM INFORMASI) */
document.getElementById("education").innerHTML =
Array.from(qsa("#education > div > div"))
.filter(e => (e.querySelector("h3")?.innerText || "").includes("D3 Sistem Informasi"))
.map(e => `
<div class="item">
<b>${e.querySelector("h3")?.innerText || ""}</b><br>
<small>${e.querySelector("em")?.innerText || ""}</small>
</div>
`).join("");

/* CERT */
document.getElementById("certificates").innerHTML =
Array.from(qsa("#certificates .card h3"))
.map(c => `<div class="item">• ${c.innerText}</div>`)
.join("");

/* PROJECT */
document.getElementById("projects").innerHTML =
Array.from(qsa("#projects .card h3"))
.map(p => `<div class="item">• ${p.innerText}</div>`)
.join("");

/* PDF FIX (ANTI HEADER TURUN) */
function downloadPDF(){
const element = document.getElementById("cv");

html2pdf()
.set({
  margin: 0,
  filename: "CV_Atalarik.pdf",
  image: { type: "jpeg", quality: 1 },
  html2canvas: {
    scale: 2,
    scrollY: 0,
    useCORS: true
  },
  jsPDF: {
    unit: "mm",
    format: "a4",
    orientation: "portrait"
  },
  pagebreak: {
    mode: ["avoid-all", "css", "legacy"]
  }
})
.from(element)
.save();
}

</script>

</body>
</html>
