<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV ATS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
margin:0;
padding:20px;
background:#ddd;
font-family:Arial,sans-serif;
}

#cv{
width:210mm;
min-height:297mm;
background:white;
margin:auto;
padding:25px;
box-sizing:border-box;
}

button{
position:fixed;
top:20px;
right:20px;
padding:10px 15px;
border:none;
background:#2563eb;
color:white;
cursor:pointer;
border-radius:6px;
}

.header{
display:flex;
gap:20px;
align-items:center;
margin-bottom:20px;
}

.header img{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
border:2px solid #000;
}

h1{
margin:0;
font-size:26px;
}

h3{
margin:5px 0;
font-weight:normal;
color:#444;
}

.section{
margin-top:15px;
}

.section h2{
font-size:16px;
border-bottom:2px solid #000;
padding-bottom:3px;
margin-bottom:8px;
}

ul{
margin:0;
padding-left:18px;
}

.contact p{
margin:2px 0;
font-size:13px;
}

.about{
font-size:14px;
text-align:justify;
}

.item{
margin-bottom:8px;
}

small{
color:#555;
}

</style>

</head>
<body>

<button onclick="downloadPDF()">Download PDF</button>

<div id="cv">

<!-- HEADER -->
<div class="header">
<img id="photo">
<div>
<h1 id="name"></h1>
<h3 id="title"></h3>

<div class="contact">
<p id="phone"></p>
<p id="email"></p>
<p id="location"></p>
<p id="github"></p>
<p id="portfolio"></p>
</div>

</div>
</div>

<!-- ABOUT -->
<div class="section">
<h2>Profil</h2>
<p class="about" id="about"></p>
</div>

<!-- SKILL -->
<div class="section">
<h2>Keahlian</h2>
<ul id="skills"></ul>
</div>

<!-- EXPERIENCE -->
<div class="section">
<h2>Pengalaman</h2>
<div id="experience"></div>
</div>

<!-- EDUCATION -->
<div class="section">
<h2>Pendidikan</h2>
<div id="education"></div>
</div>

<!-- CERT -->
<div class="section">
<h2>Sertifikat</h2>
<div id="certificates"></div>
</div>

<!-- PROJECT -->
<div class="section">
<h2>Proyek</h2>
<div id="projects"></div>
</div>

</div>

<script>

// AMBIL DARI INDEX (opener window)
const source = window.opener || window;

function qs(sel){
return source.document.querySelector(sel);
}

function qsa(sel){
return source.document.querySelectorAll(sel);
}

// FOTO
document.getElementById("photo").src =
qs("#home img")?.src || "";

// NAME + TITLE
document.getElementById("name").innerText =
qs("#home h1")?.innerText || "";

document.getElementById("title").innerText =
qs("#home p")?.innerText || "";

// CONTACT dari hidden data
const dataBox = qs("#cv-data");

document.getElementById("phone").innerText =
"📱 " + (dataBox?.dataset.phone || "");

document.getElementById("email").innerText =
"📧 " + (dataBox?.dataset.email || "");

document.getElementById("location").innerText =
"📍 " + (dataBox?.dataset.location || "");

document.getElementById("github").innerText =
"💻 " + (dataBox?.dataset.github || "");

document.getElementById("portfolio").innerText =
"🌐 " + (dataBox?.dataset.portfolio || "");

// ABOUT
document.getElementById("about").innerText =
qs("#about p")?.innerText || "";

// SKILLS
qsa("#skills i").forEach(i=>{
let li = document.createElement("li");
li.innerText = i.getAttribute("title");
document.getElementById("skills").appendChild(li);
});

// EXPERIENCE
qsa("#experience > div").forEach(div=>{
let title = div.querySelector("h3")?.innerText || "";
let date = div.querySelector("em")?.innerText || "";
let ul = div.querySelectorAll("li");

let text = `<div class="item">
<b>${title}</b><br>
<small>${date}</small><br>`;

ul.forEach(li=>{
text += `• ${li.innerText}<br>`;
});

text += `</div>`;

document.getElementById("experience").innerHTML += text;
});

// EDUCATION
qsa("#education > div").forEach(div=>{
let title = div.querySelector("h3")?.innerText || "";
let date = div.querySelector("em")?.innerText || "";

document.getElementById("education").innerHTML += `
<div class="item">
<b>${title}</b><br>
<small>${date}</small>
</div>`;
});

// CERTIFICATES (ambil dari card h3)
qsa("#certificates .card h3").forEach(h3=>{
let div = document.createElement("div");
div.className = "item";
div.innerText = "• " + h3.innerText;
document.getElementById("certificates").appendChild(div);
});

// PROJECTS
qsa("#projects .card h3").forEach(h3=>{
let div = document.createElement("div");
div.className = "item";
div.innerText = "• " + h3.innerText;
document.getElementById("projects").appendChild(div);
});

// PDF
function downloadPDF(){

html2pdf().set({
margin:5,
filename:"CV_Atalarik_Satria_Dinata.pdf",
image:{type:"jpeg",quality:1},
html2canvas:{scale:2},
jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
}).from(document.getElementById("cv")).save();

}

</script>

</body>
</html>
